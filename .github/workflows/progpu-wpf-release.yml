name: LibreWPF Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version to build.
        required: true
        default: 0.1.0-preview.65
      progpu_version:
        description: Exact immutable ProGPU package version consumed by LibreWPF.
        required: true
        default: ''
      publish:
        description: Push packages to NuGet.org after validation.
        required: true
        type: boolean
        default: false
      release_ref:
        description: Existing immutable LibreWPF tag or commit to check out for recovery publication.
        required: false
        default: ''
  push:
    tags:
      - librewpf-v*

permissions:
  actions: read
  contents: write

jobs:
  windows-managed-runtime:
    name: Windows managed runtime payload
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Windows PresentationCore
        shell: pwsh
        run: ./eng/progpu-wpf-windows-managed-runtime.ps1

      - name: Upload Windows managed runtime
        uses: actions/upload-artifact@v4
        with:
          name: librewpf-windows-managed-runtime-${{ github.sha }}
          path: artifacts/windows-managed-runtime/**/*
          if-no-files-found: error

  preview:
    name: Build preview packages
    needs: windows-managed-runtime
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Windows managed runtime
        uses: actions/download-artifact@v4
        with:
          name: librewpf-windows-managed-runtime-${{ github.sha }}
          path: artifacts/windows-managed-runtime

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#librewpf-v}"
          else
            version="${{ inputs.version }}"
          fi
          progpu_version="${{ inputs.progpu_version }}"
          if [[ -z "${progpu_version}" ]]; then
            progpu_version="${version}"
          fi
          echo "PROGPU_WPF_DEV_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "PROGPU_WPF_PROGPU_PACKAGE_VERSION=${progpu_version}" >> "${GITHUB_ENV}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved LibreWPF package version: ${version}"

      - name: Verify docs
        run: ./eng/progpu-wpf-verify-docs.sh

      - name: Build canonical LibreWinForms package closure
        env:
          # ProGPU release CI owns these tests; LibreWPF's SDK root uses MTP.
          PROGPU_WPF_RUN_DRAWING_QUALITY_GATES: 0
          PROGPU_WPF_CANONICAL_PROGPU_PACKAGE_VERSION: ${{ env.PROGPU_WPF_PROGPU_PACKAGE_VERSION }}
        run: ./eng/progpu-wpf-canonical-winforms-integration.sh

      - name: Stage exact ProGPU release packages
        shell: bash
        run: |
          set -euo pipefail
          tag="v${PROGPU_WPF_PROGPU_PACKAGE_VERSION}"
          tag_ref="refs/tags/${tag}"
          tag_commit="$(git ls-remote https://github.com/wieslawsoltes/ProGPU.git "${tag_ref}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${tag_commit}" ]]; then
            tag_commit="$(git ls-remote https://github.com/wieslawsoltes/ProGPU.git "${tag_ref}" | awk 'NR == 1 { print $1 }')"
          fi
          submodule_commit="$(git -C external/ProGPU rev-parse HEAD)"
          if [[ -z "${tag_commit}" ]]; then
            echo "Could not resolve ${tag}." >&2
            exit 1
          fi
          if [[ "$(git -C external/ProGPU rev-parse --is-shallow-repository)" == "true" ]]; then
            git -C external/ProGPU fetch --no-tags --unshallow origin
          fi
          git -C external/ProGPU fetch --no-tags origin "${tag_commit}"
          if [[ "${tag_commit}" != "${submodule_commit}" ]]; then
            echo "LibreWPF ProGPU submodule ${submodule_commit} does not exactly match ${tag} (${tag_commit})." >&2
            exit 1
          fi
          echo "PROGPU_WPF_EXPECTED_PROGPU_PACKAGE_COMMIT=${tag_commit}" >> "${GITHUB_ENV}"

          package_dir="${RUNNER_TEMP}/progpu-${PROGPU_WPF_PROGPU_PACKAGE_VERSION}"
          mkdir -p "${package_dir}"
          source eng/progpu-preview-package-list.sh
          for package_id in "${progpu_preview_runtime_package_ids[@]}"; do
            package_file="${package_id}.${PROGPU_WPF_PROGPU_PACKAGE_VERSION}.nupkg"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "${package_dir}/${package_file}" \
              "https://github.com/wieslawsoltes/ProGPU/releases/download/${tag}/${package_file}"
          done
          echo "PROGPU_WPF_PREPACKAGED_PROGPU_DIR=${package_dir}" >> "${GITHUB_ENV}"

          # The canonical Forms build compiles against this pinned ProGPU source,
          # then package consumers must resolve only the byte-exact public release.
          # Retain its source-built packages outside the feed for diagnostics:
          # allowing both versions into the feed makes version discovery ambiguous.
          canonical_dir="${GITHUB_WORKSPACE}/artifacts/packages/CanonicalWinForms"
          source_package_dir="${RUNNER_TEMP}/canonical-progpu-source-packages"
          mkdir -p "${canonical_dir}"
          mkdir -p "${source_package_dir}"
          for package_id in "${progpu_preview_runtime_package_ids[@]}"; do
            package_file="${package_id}.${PROGPU_WPF_PROGPU_PACKAGE_VERSION}.nupkg"
            for produced_package in "${canonical_dir}/${package_id}."[0-9]*.nupkg; do
              [[ -f "${produced_package}" ]] || continue
              retained_package="${source_package_dir}/${produced_package##*/}"
              test ! -e "${retained_package}"
              mv "${produced_package}" "${retained_package}"
            done
            cp "${package_dir}/${package_file}" "${canonical_dir}/${package_file}"
            cmp "${package_dir}/${package_file}" "${canonical_dir}/${package_file}"
          done

          # The immutable LibreWPF tag uses a prefix-based package discovery
          # helper: ProGPU.Backend also matches .Dawn and .Native there. Supply
          # that tagged helper a narrow lookup/feed directory without changing
          # the tagged source. Its other exact ProGPU dependencies are staged
          # separately by the SDK script into the release package output.
          consumer_dir="${RUNNER_TEMP}/canonical-winforms-consumer"
          mkdir -p "${consumer_dir}"
          shopt -s nullglob
          for package_id in \
            LibreWinForms.System.Windows.Forms \
            LibreWinForms.ProGPU \
            LibreWinForms.WindowsFormsIntegration
          do
            matches=("${canonical_dir}/${package_id}."[0-9]*.nupkg)
            if [[ "${#matches[@]}" != "1" ]]; then
              echo "Expected one canonical ${package_id} package, found ${#matches[@]}." >&2
              exit 1
            fi
            cp "${matches[0]}" "${consumer_dir}/"
          done
          shopt -u nullglob
          backend_file="ProGPU.Backend.${PROGPU_WPF_PROGPU_PACKAGE_VERSION}.nupkg"
          cp "${canonical_dir}/${backend_file}" "${consumer_dir}/${backend_file}"
          cmp "${package_dir}/${backend_file}" "${consumer_dir}/${backend_file}"
          echo "PROGPU_WPF_CANONICAL_WINFORMS_PACKAGE_DIR=${consumer_dir}" >> "${GITHUB_ENV}"

      - name: Stage native runtimes from exact ProGPU release package
        shell: bash
        run: |
          set -euo pipefail
          native_package="${PROGPU_WPF_PREPACKAGED_PROGPU_DIR}/ProGPU.Backend.Native.${PROGPU_WPF_PROGPU_PACKAGE_VERSION}.nupkg"
          runtime_stage="${GITHUB_WORKSPACE}/external/ProGPU/artifacts/progpu-native/package"
          test -s "${native_package}"
          mkdir -p "${runtime_stage}"
          unzip -q -o "${native_package}" 'runtimes/*' -d "${runtime_stage}"
          native_dir="${runtime_stage}/runtimes/osx-arm64/native"
          test -s "${native_dir}/libprogpu_native.dylib"
          test -s "${native_dir}/libprogpu_native_dawn.dylib"

          # Source-host harnesses need the selected WebGPU loader beside the
          # exact release native payload, as in the qualified Build lane.
          dotnet restore external/ProGPU/src/ProGPU.Backend/ProGPU.Backend.csproj
          package_version="$(sed -n 's/.*PackageVersion Include="Silk.NET.WebGPU.Native.WGPU" Version="\([^"]*\)".*/\1/p' external/ProGPU/Directory.Packages.props)"
          test -n "${package_version}"
          package_root="$(dotnet nuget locals global-packages --list | sed -E 's/^[^:]+:[[:space:]]*//')"
          stock_runtime="${package_root%/}/silk.net.webgpu.native.wgpu/${package_version}/runtimes/osx-arm64/native/libwgpu_native.dylib"
          test -s "${stock_runtime}"
          runtime_dir="${GITHUB_WORKSPACE}/external/ProGPU/artifacts/progpu-native/runtime"
          mkdir -p "${runtime_dir}"
          cp "${stock_runtime}" "${runtime_dir}/libwgpu_native.dylib"
          echo "PROGPU_NATIVE_BUILD_DIR=${native_dir}" >> "${GITHUB_ENV}"
          echo "PROGPU_NATIVE_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"

      - name: Build, pack, and smoke SDK
        run: ./eng/progpu-wpf-sdk-ci.sh

      - name: Verify clean release provenance
        run: PROGPU_WPF_PREVIEW_RELEASE_REQUIRE_CLEAN_SOURCE=1 ./eng/progpu-preview-release-verify.sh

      - name: Upload preview packages
        uses: actions/upload-artifact@v4
        with:
          name: librewpf-packages-${{ env.PROGPU_WPF_DEV_PACKAGE_VERSION }}
          path: |
            artifacts/packages/Release/NonShipping/*.nupkg
            artifacts/packages/Release/NonShipping/*.json
            artifacts/packages/Release/NonShipping/*.tar.gz
            artifacts/packages/Release/NonShipping/*.sha256
            artifacts/packages/Release/NonShipping/README.md
            artifacts/packages/Release/NonShipping/NuGet.config
          if-no-files-found: error

  windows-anycpu-smoke:
    name: Windows AnyCPU package launch
    needs: preview
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PROGPU_WPF_DEV_PACKAGE_VERSION: ${{ needs.preview.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download preview packages
        uses: actions/download-artifact@v4
        with:
          name: librewpf-packages-${{ needs.preview.outputs.version }}
          path: artifacts/packages/Release/NonShipping

      - name: Run clean Windows AnyCPU package smoke
        shell: pwsh
        run: |
          ./eng/progpu-wpf-windows-anycpu-smoke.ps1 -Configuration Release
          ./eng/progpu-wpf-windows-anycpu-smoke.ps1 -Configuration Debug

  publish:
    name: Publish validated preview
    needs:
      - preview
      - windows-anycpu-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROGPU_WPF_DEV_PACKAGE_VERSION: ${{ needs.preview.outputs.version }}

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Download validated preview packages
        uses: actions/download-artifact@v4
        with:
          name: librewpf-packages-${{ needs.preview.outputs.version }}
          path: artifacts/packages/Release/NonShipping

      - name: Publish to NuGet.org
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/librewpf-v') }}
        shell: bash
        run: |
          set -euo pipefail
          for package_id in LibreWPF.Transport LibreWPF.ProGPU LibreWPF.Sdk; do
            dotnet nuget push \
              "artifacts/packages/Release/NonShipping/${package_id}.${PROGPU_WPF_DEV_PACKAGE_VERSION}.nupkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/librewpf-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/packages/Release/NonShipping/*.nupkg \
            artifacts/packages/Release/NonShipping/*.json \
            artifacts/packages/Release/NonShipping/*.tar.gz \
            artifacts/packages/Release/NonShipping/*.sha256 \
            artifacts/packages/Release/NonShipping/README.md \
            artifacts/packages/Release/NonShipping/NuGet.config \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LibreWPF ${{ env.PROGPU_WPF_DEV_PACKAGE_VERSION }}" \
            --generate-notes \
            --verify-tag \
            --prerelease
