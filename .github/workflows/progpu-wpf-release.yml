name: LibreWPF Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version to build.
        required: true
        default: 0.1.0-preview.42
      progpu_version:
        description: Exact immutable ProGPU package version consumed by LibreWPF.
        required: true
        default: 0.1.0-preview.51
      publish:
        description: Push packages to NuGet.org after validation.
        required: true
        type: boolean
        default: false
      release_ref:
        description: Existing immutable LibreWPF tag or commit to check out for recovery publication.
        required: false
        default: ''
  push:
    tags:
      - librewpf-v*

permissions:
  actions: read
  contents: write

jobs:
  promote-qualified-preview:
    name: Promote exact qualified preview
    if: ${{ startsWith(github.ref, 'refs/tags/librewpf-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#librewpf-v}"
          echo "PROGPU_WPF_DEV_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved LibreWPF package version: ${version}"

      - name: Download exact qualified Build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out release commit does not match ${GITHUB_SHA}." >&2
            exit 1
          fi

          runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/progpu-wpf-sdk.yml/runs?head_sha=${GITHUB_SHA}&per_page=100"
          )"
          run_id="$(
            jq -r \
              --arg sha "${GITHUB_SHA}" \
              '[
                .workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.run_started_at)
              | last
              | .id // empty' \
              <<<"${runs}"
          )"
          if [[ -z "${run_id}" ]]; then
            echo "No terminal-success LibreWPF Build run exists for ${GITHUB_SHA}." >&2
            exit 1
          fi

          artifact_name="librewpf-ci-packages-${GITHUB_SHA}"
          artifact_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"${artifact_name}\" and .expired == false) | .id" \
              | tail -n 1
          )"
          if [[ -z "${artifact_id}" ]]; then
            echo "Qualified Build ${run_id} has no live ${artifact_name} artifact." >&2
            exit 1
          fi

          destination="${GITHUB_WORKSPACE}/artifacts/packages/Release/NonShipping"
          mkdir -p "${destination}"
          archive="${RUNNER_TEMP}/${artifact_name}.zip"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "${archive}"
          unzip -q "${archive}" -d "${destination}"
          echo "Promoted Build run ${run_id}, artifact ${artifact_id}, for ${GITHUB_SHA}."

      - name: Verify promoted release provenance
        run: |
          ./eng/progpu-wpf-verify-docs.sh
          PROGPU_WPF_PREVIEW_RELEASE_REQUIRE_CLEAN_SOURCE=1 \
            ./eng/progpu-preview-release-verify.sh

      - name: Upload promoted preview packages
        uses: actions/upload-artifact@v4
        with:
          name: librewpf-packages-${{ env.PROGPU_WPF_DEV_PACKAGE_VERSION }}
          path: |
            artifacts/packages/Release/NonShipping/*.nupkg
            artifacts/packages/Release/NonShipping/*.json
            artifacts/packages/Release/NonShipping/*.tar.gz
            artifacts/packages/Release/NonShipping/*.sha256
            artifacts/packages/Release/NonShipping/README.md
            artifacts/packages/Release/NonShipping/NuGet.config
          if-no-files-found: error

  windows-managed-runtime:
    name: Windows managed runtime payload
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Windows PresentationCore
        shell: pwsh
        run: ./eng/progpu-wpf-windows-managed-runtime.ps1

      - name: Upload Windows managed runtime
        uses: actions/upload-artifact@v4
        with:
          name: librewpf-windows-managed-runtime-${{ github.sha }}
          path: artifacts/windows-managed-runtime/**/*
          if-no-files-found: error

  preview:
    name: Build preview packages
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: windows-managed-runtime
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Windows managed runtime
        uses: actions/download-artifact@v4
        with:
          name: librewpf-windows-managed-runtime-${{ github.sha }}
          path: artifacts/windows-managed-runtime

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#librewpf-v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "PROGPU_WPF_DEV_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "PROGPU_WPF_PROGPU_PACKAGE_VERSION=${{ inputs.progpu_version || '0.1.0-preview.51' }}" >> "${GITHUB_ENV}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved LibreWPF package version: ${version}"

      - name: Verify docs
        run: ./eng/progpu-wpf-verify-docs.sh

      - name: Stage exact ProGPU release packages
        shell: bash
        run: |
          set -euo pipefail
          tag="v${PROGPU_WPF_PROGPU_PACKAGE_VERSION}"
          tag_ref="refs/tags/${tag}"
          tag_commit="$(git ls-remote https://github.com/wieslawsoltes/ProGPU.git "${tag_ref}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${tag_commit}" ]]; then
            tag_commit="$(git ls-remote https://github.com/wieslawsoltes/ProGPU.git "${tag_ref}" | awk 'NR == 1 { print $1 }')"
          fi
          submodule_commit="$(git -C external/ProGPU rev-parse HEAD)"
          if [[ -z "${tag_commit}" || "${tag_commit}" != "${submodule_commit}" ]]; then
            echo "LibreWPF ProGPU submodule ${submodule_commit} does not match ${tag} (${tag_commit:-missing})." >&2
            exit 1
          fi

          package_dir="${RUNNER_TEMP}/progpu-${PROGPU_WPF_PROGPU_PACKAGE_VERSION}"
          mkdir -p "${package_dir}"
          source eng/progpu-preview-package-list.sh
          for package_id in "${progpu_preview_runtime_package_ids[@]}"; do
            package_file="${package_id}.${PROGPU_WPF_PROGPU_PACKAGE_VERSION}.nupkg"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "${package_dir}/${package_file}" \
              "https://github.com/wieslawsoltes/ProGPU/releases/download/${tag}/${package_file}"
          done
          echo "PROGPU_WPF_PREPACKAGED_PROGPU_DIR=${package_dir}" >> "${GITHUB_ENV}"

      - name: Build, pack, and smoke SDK
        run: ./eng/progpu-wpf-sdk-ci.sh

      - name: Verify clean release provenance
        run: PROGPU_WPF_PREVIEW_RELEASE_REQUIRE_CLEAN_SOURCE=1 ./eng/progpu-preview-release-verify.sh

      - name: Upload preview packages
        uses: actions/upload-artifact@v4
        with:
          name: librewpf-packages-${{ env.PROGPU_WPF_DEV_PACKAGE_VERSION }}
          path: |
            artifacts/packages/Release/NonShipping/*.nupkg
            artifacts/packages/Release/NonShipping/*.json
            artifacts/packages/Release/NonShipping/*.tar.gz
            artifacts/packages/Release/NonShipping/*.sha256
            artifacts/packages/Release/NonShipping/README.md
            artifacts/packages/Release/NonShipping/NuGet.config
          if-no-files-found: error

  windows-anycpu-smoke:
    name: Windows AnyCPU package launch
    needs:
      - preview
      - promote-qualified-preview
    if: ${{ always() && !cancelled() && (needs.preview.result == 'success' || needs.promote-qualified-preview.result == 'success') }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PROGPU_WPF_DEV_PACKAGE_VERSION: ${{ needs.promote-qualified-preview.outputs.version || needs.preview.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download preview packages
        uses: actions/download-artifact@v4
        with:
          name: librewpf-packages-${{ needs.promote-qualified-preview.outputs.version || needs.preview.outputs.version }}
          path: artifacts/packages/Release/NonShipping

      - name: Run clean Windows AnyCPU package smoke
        shell: pwsh
        run: |
          ./eng/progpu-wpf-windows-anycpu-smoke.ps1 -Configuration Release
          ./eng/progpu-wpf-windows-anycpu-smoke.ps1 -Configuration Debug

  publish:
    name: Publish validated preview
    needs:
      - preview
      - promote-qualified-preview
      - windows-anycpu-smoke
    if: ${{ always() && !cancelled() && needs.windows-anycpu-smoke.result == 'success' && (needs.preview.result == 'success' || needs.promote-qualified-preview.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROGPU_WPF_DEV_PACKAGE_VERSION: ${{ needs.promote-qualified-preview.outputs.version || needs.preview.outputs.version }}

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Download validated preview packages
        uses: actions/download-artifact@v4
        with:
          name: librewpf-packages-${{ needs.promote-qualified-preview.outputs.version || needs.preview.outputs.version }}
          path: artifacts/packages/Release/NonShipping

      - name: Publish to NuGet.org
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/librewpf-v') }}
        shell: bash
        run: |
          set -euo pipefail
          for package_id in LibreWPF.Transport LibreWPF.ProGPU LibreWPF.Sdk; do
            dotnet nuget push \
              "artifacts/packages/Release/NonShipping/${package_id}.${PROGPU_WPF_DEV_PACKAGE_VERSION}.nupkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/librewpf-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/packages/Release/NonShipping/*.nupkg \
            artifacts/packages/Release/NonShipping/*.json \
            artifacts/packages/Release/NonShipping/*.tar.gz \
            artifacts/packages/Release/NonShipping/*.sha256 \
            artifacts/packages/Release/NonShipping/README.md \
            artifacts/packages/Release/NonShipping/NuGet.config \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LibreWPF ${{ env.PROGPU_WPF_DEV_PACKAGE_VERSION }}" \
            --generate-notes \
            --verify-tag \
            --prerelease
