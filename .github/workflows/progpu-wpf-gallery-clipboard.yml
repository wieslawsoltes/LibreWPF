name: Original Gallery clipboard acceptance

on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact fully qualified LibreWPF producer commit (40 hexadecimal characters)
        required: true
        type: string
      build:
        description: Complete successful LibreWPF Build run ID for this commit
        required: true
        type: string
      docs:
        description: Complete successful LibreWPF Docs run ID for this commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  original-gallery:
    name: Observe Gallery managed startup stacks (diagnostic only)
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_HEAD: ${{ inputs.head }}
      PRODUCER_BUILD: ${{ inputs.build }}
      PRODUCER_DOCS: ${{ inputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
      - name: Checkout hosted environment correction separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: hosted-environment
      - name: Read the exact original consumer compiler
        id: consumer-compiler
        shell: pwsh
        run: |
          $compiler = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          if ($compiler -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "The qualified source must declare an exact compiler version."
          }
          "version=$compiler" >> $env:GITHUB_OUTPUT
          "CASE_ROOT=$(Join-Path $env:RUNNER_TEMP 'gallery-clipboard-ci')" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          # global-json-file honors latestFeature and installs a newer SDK;
          # prepare.py deliberately disables roll-forward for this consumer.
          dotnet-version: |
            10.0.x
            ${{ steps.consumer-compiler.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged capture and producer admission controls
        run: python eng/WindowsGalleryClipboardConsumer/test_contract.py -v
      - name: Prepare original consumer from whole successful producer
        shell: pwsh
        run: |
          python eng/WindowsGalleryClipboardConsumer/prepare-ci.py `
            --head $env:PRODUCER_HEAD --build $env:PRODUCER_BUILD --docs $env:PRODUCER_DOCS `
            --output $env:CASE_ROOT --dotnet (Get-Command dotnet).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned diagnostic tool and publish owned child identity
        shell: pwsh
        run: |
          dotnet tool install dotnet-trace --tool-path "$env:RUNNER_TEMP/gallery-trace-tools" --version 10.0.750501
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python hosted-environment/eng/WindowsGalleryClipboardConsumer/publish-gallery-child.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Close identified hosted startup window through its normal close request
        shell: pwsh
        run: |
          python hosted-environment/eng/WindowsGalleryClipboardConsumer/close-hosted-account.py --output "$env:CASE_ROOT/hosted-environment.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run original captures with an empty disposable CI clipboard
        shell: pwsh
        run: |
          $observerArgs = @("hosted-environment/eng/WindowsGalleryClipboardConsumer/observe-gallery-stacks.py", "--root", $env:CASE_ROOT, "--tool", "$env:RUNNER_TEMP/gallery-trace-tools/dotnet-trace.exe") | ForEach-Object { '"' + $_ + '"' }
          $observer = Start-Process -FilePath (Get-Command python).Source -ArgumentList $observerArgs -PassThru -RedirectStandardOutput "$env:CASE_ROOT/observer.stdout.log" -RedirectStandardError "$env:CASE_ROOT/observer.stderr.log"
          python "$env:CASE_ROOT/consumer/run-windows.py" `
            --app "$env:CASE_ROOT/consumer/bin/Release/net10.0-windows/GalleryClipboardApp.exe" `
            --output "$env:CASE_ROOT/runtime" --require-empty-ci-clipboard
          $originalCode = $LASTEXITCODE
          if (!$observer.WaitForExit(110000)) { $observer.Kill(); $observer.WaitForExit() }
          exit $originalCode
      - name: Retain original receipts and captures for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-clipboard-${{ inputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.CASE_ROOT }}/inputs/*.json
            ${{ env.CASE_ROOT }}/consumer/preparation.json
            ${{ env.CASE_ROOT }}/consumer/build.log
            ${{ env.CASE_ROOT }}/consumer/source-manifest.json
            ${{ env.CASE_ROOT }}/original/Assets/ControlImages/Clipboard.png
            ${{ env.CASE_ROOT }}/original/LICENSE
            ${{ env.CASE_ROOT }}/runtime/**
            ${{ env.CASE_ROOT }}/stack-observation/**
            ${{ env.CASE_ROOT }}/observer.*.log
            ${{ env.CASE_ROOT }}/consumer/stack-observation-source.json
            ${{ env.CASE_ROOT }}/consumer/run-windows.original.py.txt
            ${{ env.CASE_ROOT }}/hosted-environment.json
