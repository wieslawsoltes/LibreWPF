name: Original Gallery clipboard acceptance

on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact fully qualified LibreWPF producer commit (40 hexadecimal characters)
        required: true
        type: string
      build:
        description: Complete successful LibreWPF Build run ID for this commit
        required: true
        type: string
      docs:
        description: Complete successful LibreWPF Docs run ID for this commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  original-gallery:
    name: Original Gallery image clipboard on Windows 11 ARM64
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_HEAD: ${{ inputs.head }}
      PRODUCER_BUILD: ${{ inputs.build }}
      PRODUCER_DOCS: ${{ inputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
      - name: Checkout read-only diagnostic observer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: caption-diagnostic
      - name: Read the exact original consumer compiler
        id: consumer-compiler
        shell: pwsh
        run: |
          $compiler = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          if ($compiler -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "The qualified source must declare an exact compiler version."
          }
          "version=$compiler" >> $env:GITHUB_OUTPUT
          "CASE_ROOT=$(Join-Path $env:RUNNER_TEMP 'gallery-clipboard-ci')" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          # global-json-file honors latestFeature and installs a newer SDK;
          # prepare.py deliberately disables roll-forward for this consumer.
          dotnet-version: |
            10.0.x
            ${{ steps.consumer-compiler.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged capture and producer admission controls
        run: python eng/WindowsGalleryClipboardConsumer/test_contract.py -v
      - name: Prepare original consumer from whole successful producer
        shell: pwsh
        run: |
          python eng/WindowsGalleryClipboardConsumer/prepare-ci.py `
            --head $env:PRODUCER_HEAD --build $env:PRODUCER_BUILD --docs $env:PRODUCER_DOCS `
            --output $env:CASE_ROOT --dotnet (Get-Command dotnet).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run original captures with an empty disposable CI clipboard
        shell: pwsh
        run: |
          $observer = Start-Process -FilePath (Get-Command python).Source -ArgumentList @(
            'caption-diagnostic/eng/WindowsGalleryClipboardConsumer/observe-caption.py',
            '--runtime', "$env:CASE_ROOT/runtime", '--output', "$env:CASE_ROOT/caption-observer.json"
          ) -NoNewWindow -PassThru
          try {
            python "$env:CASE_ROOT/consumer/run-windows.py" `
              --app "$env:CASE_ROOT/consumer/bin/Release/net10.0-windows/GalleryClipboardApp.exe" `
              --output "$env:CASE_ROOT/runtime" --require-empty-ci-clipboard
            $originalExit = $LASTEXITCODE
          } finally {
            if (-not $observer.WaitForExit(2000)) { $observer.Kill(); $observer.WaitForExit() }
          }
          if ($originalExit -ne 0) { exit $originalExit }
      - name: Retain original receipts and captures for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-clipboard-${{ inputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.CASE_ROOT }}/inputs/*.json
            ${{ env.CASE_ROOT }}/consumer/preparation.json
            ${{ env.CASE_ROOT }}/consumer/build.log
            ${{ env.CASE_ROOT }}/consumer/source-manifest.json
            ${{ env.CASE_ROOT }}/original/Assets/ControlImages/Clipboard.png
            ${{ env.CASE_ROOT }}/original/LICENSE
            ${{ env.CASE_ROOT }}/runtime/**
            ${{ env.CASE_ROOT }}/caption-observer.json
