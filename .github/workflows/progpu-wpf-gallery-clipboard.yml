name: Original Gallery clipboard acceptance
on:
  workflow_dispatch:
    inputs:
      head:
        required: true
        type: string
      build:
        required: true
        type: string
      docs:
        required: true
        type: string
permissions:
  contents: read
jobs:
  desktop-observer:
    name: Read hosted Windows foreground identity (diagnostic only)
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read foreground ownership without input or clipboard access
        shell: pwsh
        run: |
          python eng/WindowsGalleryClipboardConsumer/observe-caption.py --preflight --runtime "$env:RUNNER_TEMP" --output "$env:RUNNER_TEMP/caption-preflight.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read account window controls without input or clipboard access
        shell: pwsh
        timeout-minutes: 1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng/WindowsGalleryClipboardConsumer/inspect-foreground.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-caption-preflight-${{ github.run_id }}
          retention-days: 7
          path: ${{ runner.temp }}/caption-*.json
