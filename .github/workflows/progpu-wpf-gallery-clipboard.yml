name: Diagnostic Gallery compiler comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  comparison:
    name: Original scene pixels with stock FXC and packaged FXC/DXC
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: eng/WindowsGalleryCompilerComparison
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            10.0.201
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare unchanged full scenes with their original sixty-second bound
        run: python eng/WindowsGalleryCompilerComparison/compare.py
      - name: Retain all completed and failed original cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-compiler-comparison-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/gallery-compiler-comparison/evidence/**
