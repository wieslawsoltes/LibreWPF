name: Original Gallery clipboard acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  glyph-jit-observation:
    name: Observe original Showcase GlyphRun ARM64 codegen (diagnostic only)
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PROGPU_WPF_QUALIFIED_COMMIT: 044a1461019c52fb9fd747e096036d7763a3fe3f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 044a1461019c52fb9fd747e096036d7763a3fe3f
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-harness
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete original producer and package digest
        run: python diagnostic-harness/eng/diagnostics/prepare-hosted-jit.py
      - uses: actions/download-artifact@v4
        with:
          name: showcase-native-debugger-arm64-044a1461019c52fb9fd747e096036d7763a3fe3f
          run-id: 38326178889
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/showcase-native-debugger
      - name: Run original launcher with method-specific codegen observation
        shell: pwsh
        env:
          DOTNET_JitDisasm: '*TryGetPortableNativeGlyphRun*'
          DOTNET_JitDisasmWithCodeBytes: '1'
        run: |
          dotnet --info
          ./eng/progpu-wpf-windows-native-mil-showcase.ps1 -TargetArchitecture arm64 -ValidatePassiveIdle -CaptureIdleCrashDump -IdleNativeDebugger (Join-Path $env:RUNNER_TEMP 'showcase-native-debugger/ShowcaseNativeDebugger.exe')
      - name: Preserve original diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-glyph-jit-${{ github.run_id }}
          retention-days: 7
          path: |
            artifacts/glyph-jit-diagnostic/*.json
            artifacts/showcase-native-idle/win-arm64/**
