name: Original Gallery clipboard acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cpu-analysis:
    name: Read saved Gallery native CPU trace (no application run)
    runs-on: windows-11-arm
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original trace and analyse owned CPU samples
        run: python eng/diagnostics/gallery-native-cpu/analyse-native-cpu.py
      - name: Preserve analysis and reader logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-native-cpu-analysis-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/gallery-cpu-analysis/*.json
            ${{ runner.temp }}/gallery-cpu-analysis/*.log

