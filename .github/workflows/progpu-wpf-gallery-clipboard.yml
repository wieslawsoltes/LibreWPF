name: Original Gallery navigation diagnostic

on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact whole-qualified LibreWPF producer head
        required: true
        type: string
      build:
        description: Whole successful Build for that head
        required: true
        type: string
      docs:
        description: Successful Docs for that head
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  original-navigation:
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_HEAD: ${{ inputs.head }}
      PRODUCER_BUILD: ${{ inputs.build }}
      PRODUCER_DOCS: ${{ inputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          path: producer
      - name: Read original compiler and allocate fresh evidence root
        id: compiler
        shell: pwsh
        run: |
          $version = (Get-Content producer/global.json -Raw | ConvertFrom-Json).sdk.version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Exact compiler version required' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "CASE_ROOT=$(Join-Path $env:RUNNER_TEMP 'original-navigation-114')" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            ${{ steps.compiler.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original producer and hosted activation contracts
        run: python producer/eng/WindowsGalleryClipboardConsumer/test_contract.py -v
      - name: Compile unchanged navigation observer and fifteen original sources
        shell: pwsh
        run: |
          python driver/eng/DiagnosticsNavigation114/prepare.py `
            --producer "$env:GITHUB_WORKSPACE/producer" --head $env:PRODUCER_HEAD `
            --build $env:PRODUCER_BUILD --docs $env:PRODUCER_DOCS `
            --output $env:CASE_ROOT --dotnet (Get-Command dotnet).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Close identified disposable runner startup window
        shell: pwsh
        run: |
          python producer/eng/WindowsGalleryClipboardConsumer/close-hosted-account.py --output "$env:CASE_ROOT/inputs/hosted-environment.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe original Page1 Page2 back and forward with owned native input
        shell: pwsh
        run: |
          python driver/eng/DiagnosticsNavigation114/run.py --native-input-authorized `
            --producer "$env:GITHUB_WORKSPACE/producer" --case $env:CASE_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original inputs failures and raw desktop captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-navigation-114-${{ inputs.head }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.CASE_ROOT }}/inputs/**
            ${{ env.CASE_ROOT }}/runtime/**
            ${{ env.CASE_ROOT }}/consumer/GalleryNavigationApp.cs
            ${{ env.CASE_ROOT }}/consumer/GalleryNavigationApp.csproj
            ${{ env.CASE_ROOT }}/consumer/original/**
            ${{ env.CASE_ROOT }}/consumer/bin/Release/net10.0-windows/GalleryNavigationApp.*
