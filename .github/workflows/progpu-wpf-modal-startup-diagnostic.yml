name: Read-only source and retained dialog paint

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  caption:
    name: Programmatic paint observation (${{ matrix.renderer }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        renderer: [NativeMilWgpu, ManagedPortable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Prepare the original owned disposable desktop environment
        run: python3 eng/LinuxMessageBoxCaption/prepare-desktop.py
      - name: Install only the immutable helper's task-private Python dependencies
        run: |
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv --system-site-packages "$RUNNER_TEMP/caption-venv"
          "$RUNNER_TEMP/caption-venv/bin/python" -m pip install --disable-pip-version-check --no-deps python-xlib==0.33 six==1.17.0
          "$RUNNER_TEMP/caption-venv/bin/python" -c "import importlib.metadata; assert importlib.metadata.version('python-xlib') == '0.33'; assert importlib.metadata.version('six') == '1.17.0'"
      - name: Restore only the exact already-compiled consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/LinuxMessageBoxCaption/stage_frozen.py --renderer ${{ matrix.renderer }}
      - name: Compile diagnostic observer against unchanged qualified payload
        run: python3 eng/LinuxMessageBoxCaption/build_observer.py
      - name: Observe source and retained paint without native input
        run: timeout 150s dbus-run-session -- "$RUNNER_TEMP/caption-venv/bin/python" eng/LinuxMessageBoxCaption/desktop.py
      - name: Preserve every original result and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paint-tree-${{ matrix.renderer }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts
            eng/LinuxMessageBoxCaption

