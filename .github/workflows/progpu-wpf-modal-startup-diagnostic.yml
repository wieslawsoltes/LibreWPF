name: Prepare original Linux Slider candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare-slider:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.5.26302.115
      - name: Download exact whole-qualified producer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/diagnostic-fetch-candidate-archive.py
      - name: Build unchanged Slider source without execution or input
        run: python3 eng/diagnostic-prepare-slider.py --producer eng/diagnostic-producer --inputs eng/diagnostic-slider-inputs
      - name: Preserve exact candidate and complete preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-linux-slider-a255-preparation
          path: |
            ${{ runner.temp }}/original-slider-candidate/preparation.json
            ${{ runner.temp }}/original-slider-candidate/build.log
            ${{ runner.temp }}/original-slider-candidate/GallerySliderProbe.csproj
            ${{ runner.temp }}/original-slider-candidate/original-project.csproj.txt
            ${{ runner.temp }}/original-slider-candidate/bin/Release/net10.0-windows/**
          retention-days: 14
          if-no-files-found: error
