name: Original Linux Slider bounded input
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  slider-readiness:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Prepare disposable Ubuntu26 desktop and read-only capture
        run: python3 eng/diagnostic-slider-desktop-dependencies.py
      - name: Download exact retained compiled application
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/diagnostic-fetch-built-slider.py
      - name: Run approved original gestures in owned GNOME
        run: timeout 240s dbus-run-session -- python3 eng/diagnostic-slider-approved/desktop-input.py
      - name: Retain source events, native inspection and raw capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-linux-slider-bounded-input
          path: artifacts/**
          retention-days: 14
          if-no-files-found: error
