name: DIAGNOSTIC ONLY modal popup scene

on:
  workflow_dispatch:
    inputs:
      replay_only:
        description: 'Replay the retained original popup scene offscreen without launching either application'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  startup:
    name: DIAGNOSTIC ONLY original pair with popup scene and completion observation
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Preserve committed source bytes in the disposable runner checkouts
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
        with:
          ref: 22f04962dd4db089d4bd681b9bc06e0a7882c468
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0214bb4569553741244c4fdf10cb78a9dc90661f
          path: original
          persist-credentials: false
          sparse-checkout: |
            samples/ProGPU.Wpf.ModalInteractionApp
            samples/ProGPU.Wpf.ModalInteractionApp.Windows
            eng/progpu-wpf-modal-desktop.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/LibreWinForms
          ref: 1538b491c17d300387339adce7196700f41cf23a
          path: forms-helper
          persist-credentials: false
          sparse-checkout: eng
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            10.0.201
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original modal and shared hosted activation controls
        shell: pwsh
        run: |
          python automation/eng/tests/test_wpf_modal_desktop_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python automation/eng/WindowsGalleryClipboardConsumer/test_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python automation/eng/tests/test_wpf_hosted_desktop_setup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python automation/eng/tests/test_wpf_hosted_shell_escape.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python automation/eng/tests/test_wpf_hosted_start_activation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python automation/eng/tests/test_wpf_modal_source_staging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python automation/eng/tests/test_wpf_modal_candidate_packages.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the exact successful candidate producer when selected
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_HEAD: 22f04962dd4db089d4bd681b9bc06e0a7882c468
          PRODUCER_BUILD: 39030772848
          PRODUCER_DOCS: 39030772842
        run: |
          $values = @($env:PRODUCER_HEAD, $env:PRODUCER_BUILD, $env:PRODUCER_DOCS)
          $selected = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($selected.Count -ne 0 -and $selected.Count -ne 3) { throw 'Specify all three exact producer identities or none.' }
          if ($selected.Count -eq 3) {
            $inputs = Join-Path $env:RUNNER_TEMP 'modal-candidate-producer'
            "CANDIDATE_INPUTS=$inputs" >> $env:GITHUB_ENV
            python automation/eng/WindowsModalDesktop/candidate-packages.py `
              --head $env:PRODUCER_HEAD --build $env:PRODUCER_BUILD --docs $env:PRODUCER_DOCS --output $inputs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prepare original sources and verify the selected package closure
        shell: pwsh
        env:
          MODAL_DX12_COMPILER: Dxc
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'original-modal-pair'
          "CASE_ROOT=$root" >> $env:GITHUB_ENV
          $candidate = @()
          if ($env:CANDIDATE_INPUTS) { $candidate = @('--candidate-inputs', $env:CANDIDATE_INPUTS) }
          if ($env:MODAL_DX12_COMPILER -eq 'Dxc') { $candidate += @('--dx12-compiler', 'Dxc') }
          python automation/eng/WindowsModalDesktop/prepare.py `
            --source (Resolve-Path original).Path `
            --forms-helper-checkout (Resolve-Path forms-helper).Path `
            --output $root --dotnet (Get-Command dotnet).Source @candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
        with:
          path: diagnostics
          persist-credentials: false
          sparse-checkout: |
            eng
            .github/workflows
      - name: Verify original-child isolation and unchanged failure propagation
        run: python diagnostics/eng/tests/test_wpf_popup_scene_observation.py -v
      - name: Prepare the original disposable hosted desktop
        if: ${{ ! inputs.replay_only }}
        shell: pwsh
        run: |
          python automation/eng/WindowsModalDesktop/prepare-desktop.py `
            --output (Join-Path $env:RUNNER_TEMP 'original-modal-desktop-preflight.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe original popup scenes and native completion without input changes
        shell: pwsh
        env:
          PROGPU_WPF_TRACE_INPUT: '0'
          POPUP_REPLAY_ONLY: ${{ inputs.replay_only }}
        run: |
          $diagnostic = @()
          if ($env:POPUP_REPLAY_ONLY -eq 'true') { $diagnostic += '--replay-only' }
          python diagnostics/eng/WindowsModalDesktop/diagnose-popup-scene.py `
            --prepared $env:CASE_ROOT --producer-tools (Resolve-Path automation/eng/WindowsModalDesktop).Path `
            --dotnet (Get-Command dotnet).Source `
            --output (Join-Path $env:RUNNER_TEMP 'modal-popup-scene-diagnostic') @diagnostic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain diagnostic failure and exact producer receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-modal-popup-scene-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/modal-popup-scene-diagnostic/**
            ${{ runner.temp }}/modal-candidate-producer/*.json
            ${{ env.CASE_ROOT }}/preparation.json
            ${{ env.CASE_ROOT }}/*-build.log
            ${{ env.CASE_ROOT }}/runtime-inventory.txt
            ${{ env.CASE_ROOT }}/runtime/**
            ${{ env.CASE_ROOT }}/controller-result.json
            ${{ env.CASE_ROOT }}/launch.json
            ${{ runner.temp }}/original-modal-desktop-preflight.json
