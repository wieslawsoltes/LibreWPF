name: Diagnostic owned EGL display connections
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-egl-connections:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable Ubuntu26 native desktop dependencies
        run: python3 eng/diagnostic-ubuntu26-desktop.py
      - name: Observe independent owned connections in verified GNOME Xwayland
        run: timeout 90s dbus-run-session -- python3 eng/diagnostic-desktop-session.py
      - name: Retain independent native environment and lifetime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu26-owned-egl-connections
          path: artifacts/ubuntu26-*.json
          retention-days: 14
          if-no-files-found: error
