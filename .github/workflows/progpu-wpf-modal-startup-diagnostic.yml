name: Linux MessageBox caption observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  caption:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Prepare owned disposable GNOME desktop
        run: python3 eng/diagnostic-ubuntu26-desktop.py
      - name: Fetch exact whole-qualified producer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/diagnostic-fetch-candidate-archive.py
      - name: Build actual source MessageBox observer
        run: python3 eng/LinuxMessageBoxCaption/prepare.py --producer eng/diagnostic-producer --head f89f20ce48bdd417b78db71af94f98fc97cafeb9 --build 39131374625 --docs 39131374605 --progpu-head a37f235057ee58b26b3322864c62dfeb1d041715
      - name: Capture four actual native MessageBox captions without input
        run: timeout 150s dbus-run-session -- python3 eng/LinuxMessageBoxCaption/desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu26-messagebox-caption
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/ubuntu26-*.json
            artifacts/ubuntu26-*.log
            artifacts/caption-observation/**
            eng/LinuxMessageBoxCaption/**
            eng/diagnostic-producer/*.json
            ${{ runner.temp }}/messagebox-caption/build.log
