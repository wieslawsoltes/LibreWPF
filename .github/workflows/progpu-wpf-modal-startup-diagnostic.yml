name: Exact compiled Linux caption and modal input

on:
  workflow_dispatch:
    inputs:
      proposal_sha256:
        description: Explicitly approved final caption-input proposal SHA256
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  caption:
    name: Original bounded caption input (${{ matrix.renderer }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        renderer: [NativeMilWgpu, ManagedPortable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact approval before any desktop or application work
        env:
          APPROVED_PROPOSAL: ${{ inputs.proposal_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", "No unchanged retry"
          expected = hashlib.sha256(Path("eng/LinuxMessageBoxCaption/decision.txt").read_bytes()).hexdigest()
          assert os.environ["APPROVED_PROPOSAL"] == expected, "Exact final proposal approval required"
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Prepare the original owned disposable desktop environment
        run: python3 eng/LinuxMessageBoxCaption/prepare-desktop.py
      - name: Install only the immutable helper's task-private Python dependencies
        run: |
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv --system-site-packages "$RUNNER_TEMP/caption-venv"
          "$RUNNER_TEMP/caption-venv/bin/python" -m pip install --disable-pip-version-check --no-deps python-xlib==0.33 six==1.17.0
          "$RUNNER_TEMP/caption-venv/bin/python" -c "import importlib.metadata; assert importlib.metadata.version('python-xlib') == '0.33'; assert importlib.metadata.version('six') == '1.17.0'"
      - name: Restore only the exact already-compiled consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/LinuxMessageBoxCaption/stage_frozen.py --renderer ${{ matrix.renderer }}
      - name: Validate unchanged offline input contracts
        working-directory: eng/LinuxMessageBoxCaption
        run: python3 -m unittest test_staging test_contract test_executor_preflight test_native_observation -v
      - name: Run the reviewed four-dialog sequence once
        env:
          LIBREWPF_CAPTION_INPUT_APPROVAL_SHA256: ${{ inputs.proposal_sha256 }}
        run: timeout 150s dbus-run-session -- "$RUNNER_TEMP/caption-venv/bin/python" eng/LinuxMessageBoxCaption/desktop.py
      - name: Preserve every original result and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-caption-input-${{ matrix.renderer }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts
            eng/LinuxMessageBoxCaption

