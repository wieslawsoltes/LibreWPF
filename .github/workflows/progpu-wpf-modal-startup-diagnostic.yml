name: Diagnostic Ubuntu26 desktop readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-environment:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Observe disposable desktop dependencies without application input
        shell: bash
        run: python3 eng/diagnostic-ubuntu26-desktop.py
      - name: Retain independent environment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu26-desktop-environment
          path: artifacts/ubuntu26-desktop*.json
          retention-days: 7
          if-no-files-found: error
