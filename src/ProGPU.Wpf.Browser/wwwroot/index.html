<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LibreWPF – Browser Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; }
    header img { height: 24px; }
    header h1 { font-size: 14px; font-weight: 600; color: #e6edf3; }
    #app { flex: 1; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: fixed; inset: 0; background: #0d1117; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; }
    #loading .spinner { width: 40px; height: 40px; border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    #loading p { font-size: 13px; color: #8b949e; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loading overlay — hidden once Blazor and WebGPU are ready -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Initialising LibreWPF renderer…</p>
  </div>

  <header>
    <h1>LibreWPF · Browser Preview</h1>
  </header>

  <div id="app">Loading…</div>

  <!-- WebAssembly bootstrap -->
  <script src="_framework/blazor.webassembly.js" autostart="false"></script>
  <script>
    Blazor.start({ loadBootResource: undefined }).then(() => {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
